# deploy/stardust/nginx/game-static-split.conf
# 游戏 vhost 的静态拆分片段（参考模板；本仓库不自动 include，也不部署）。
#
# 目的：把大文件、纯静态的公开素材（/assets/、/media/、/fonts/、/vendor/）从 Node 游戏后端卸载到独立
# 静态 nginx / CDN，Node 只保留入口 HTML、业务代码、动态 JSON 与 WebSocket，从而卸掉 Node 的素材带宽。
#
# 落地方式二选一（不要同时 include 同一 location）：
#   A) 直接 include tools/prepare-static-release.mjs 生成的 nginx/game-static-locations.conf —— 与固定 release
#      绑定，静态侧是 exact-inventory（多一个文件都不给），是本仓库的正式产物。
#   B) 使用本模板手动 include 到游戏 443 server{}：把占位符 <RELEASE> 换成固定 release id、把上游名换成实际的
#      游戏后端 upstream。适合没有生成器产物时的最小拆分。
#
# 静态侧（ark-asset.hanabi-ai.cn:25442，root /srv/ark-static）：deploy/stardust/static/nginx.conf
#   + /opt/ark-static/generated/{cache,http,locations}/*.conf（同一生成器产出，含 /releases/<RELEASE>/{assets,
#   fonts,vendor}/ 的精确 location 与无扩展名 /media/ alias）。
#
# 与现网 ark-proto.conf 的差异：现网 /assets/、/media/ 走 material-lb（openi-resolver，302 到 OpenI/ModelScope，
# 见 MATERIAL-SOURCES.md），/fonts/、/vendor/ 走下面的 STATIC_ORIGIN 302。若要用 OpenI 多源，把本文件里
# /assets/、/media/ 两个 location 换成 `include asset-resolver-location.conf;` 即可（其余不变）。

# ---- 静态源：与 prepare-static-release.mjs 的 STATIC_ORIGIN 一致（https://ark-asset.hanabi-ai.cn:25442）----
location ^~ /assets/ {
    auth_request off;
    return 302 https://ark-asset.hanabi-ai.cn:25442/releases/<RELEASE>$request_uri;
}
location ^~ /media/ {
    auth_request off;
    return 302 https://ark-asset.hanabi-ai.cn:25442/releases/<RELEASE>$request_uri;
}
location ^~ /fonts/ {
    auth_request off;
    return 302 https://ark-asset.hanabi-ai.cn:25442/releases/<RELEASE>$request_uri;
}
location ^~ /vendor/ {
    auth_request off;
    return 302 https://ark-asset.hanabi-ai.cn:25442/releases/<RELEASE>$request_uri;
}
# 例外：被静态清单改写、必须同源的单个小适配文件仍留 Node（与现网 hook 一致）。
location = /vendor/hooks.module.js {
    auth_request off;
    proxy_pass http://ark_proto_game_backend;
}

# ---- 必须留在 Node（不要拆到静态源）----
#   location = / , /index.html        入口 HTML（门禁 / 入场动画：entry-location.conf）
#   location /                        /js/ /css/ /sim/ /shared/ /client-build 等业务代码与 /api
#   location = /ws                    WebSocket（含旧前缀 /_release/<RELEASE>/ws）
#   location = /healthz               健康检查
#   动态清单（server/http/static.js 现场生成，复制 data/ 得不到，必须回 Node）：
#     /data/assets.json, /data/local-assets.json, /data/local-fx.json, /data/resource-manifest.json,
#     /data/asset-source.json（素材源配置，见 server/http/config.js assetOriginFrom）,
#     /packs/index.json, /plugins/index.json, /cs/<cs16>/index.json
